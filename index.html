<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle · Produção</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18212f;--muted:#687386;--line:#dce2ea;--primary:#2563eb;--primary2:#eff6ff;--green:#15946b;--green2:#e9f8f2;--orange:#d97706;--orange2:#fff7e8;--red:#dc2626;--red2:#fef2f2;--shadow:0 4px 18px #18212f12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:1280px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.brand{font-size:25px;font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-top:3px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer}.btn:hover{border-color:var(--primary)}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.btn.green{background:var(--green);border-color:var(--green);color:white}.btn.red{background:var(--red2);color:var(--red);border-color:#fecaca}.nav .active{background:var(--primary);color:#fff;border-color:var(--primary)}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow)}.stat span{color:var(--muted);font-size:12px}.stat b{display:block;font-size:25px;margin-top:6px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 10px}.section h2{font-size:17px;margin:0}.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:0}.search:focus{border-color:var(--primary)}table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}.table th{font-size:12px;color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;background:#eef1f5;color:var(--muted)}.badge.green{background:var(--green2);color:var(--green)}.badge.orange{background:var(--orange2);color:var(--orange)}.badge.blue{background:var(--primary2);color:var(--primary)}.progress{height:7px;background:#edf0f4;border-radius:10px;overflow:hidden;margin-top:5px}.progress i{display:block;height:100%;background:var(--primary)}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stage{border:1px solid var(--line);border-radius:11px;padding:14px;background:#fff}.stage.done{border-color:#a7dfcc;background:#fbfffd}.stage h3{margin:6px 0;font-size:14px}.stage .ico{font-size:23px}.lot{font-weight:700;color:var(--primary);word-break:break-all}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--text)}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #bfdbfe;border-color:var(--primary)}.hint{font-size:11px;color:var(--muted)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.modal{position:fixed;inset:0;background:#10182780;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.open{display:flex}.sheet{width:min(900px,100%);max-height:94vh;overflow:auto;background:var(--card);border-radius:16px;padding:20px;box-shadow:0 20px 50px #0004}.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheet h2{margin:0}.close{border:0;background:none;font-size:25px;cursor:pointer;color:var(--muted)}.empty{text-align:center;padding:35px;color:var(--muted)}.op-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.opno{font-size:25px;font-weight:800}.timeline{display:grid;gap:8px}.event{display:grid;grid-template-columns:130px 1fr auto;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px}.event b{display:block}.print-only{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:1fr}.event{grid-template-columns:1fr}.form{grid-template-columns:1fr}}@media(max-width:560px){.app{padding:12px}.grid{grid-template-columns:1fr 1fr}.table{font-size:12px}.hide-sm{display:none}.top{align-items:flex-start}.top .btn{padding:8px}}
</style></head><body><main class="app">
<header class="top"><div class="brand">Controle<small>Produção · rastreabilidade</small></div><button class="btn primary" onclick="openProduct()">+ Novo produto</button></header>
<nav class="nav"><button class="btn active" data-v="home">Visão geral</button><button class="btn" data-v="products">Lista de produtos</button><button class="btn" data-v="ops">Ordens de produção</button><button class="btn" data-v="trace">Rastreabilidade</button></nav>
<section id="home" class="view active"><div id="stats" class="grid"></div><div class="section"><h2>Produção em andamento</h2><button class="btn primary" onclick="openOP()">+ Criar OP</button></div><div class="card" id="homeOps"></div></section>
<section id="products" class="view"><div class="section"><h2>Lista de produtos</h2><button class="btn primary" onclick="openProduct()">+ Novo produto</button></div><div class="card"><input id="prodSearch" class="search" placeholder="Pesquisar código, produto ou cliente" oninput="renderProducts()"><div id="prodTable"></div></div></section>
<section id="ops" class="view"><div class="section"><h2>Ordens de produção</h2><button class="btn primary" onclick="openOP()">+ Nova OP</button></div><div class="card"><input id="opSearch" class="search" placeholder="Pesquisar OP, código ou produto" oninput="renderOps()"><div id="opTable"></div></div></section>
<section id="trace" class="view"><div class="section"><h2>Rastreabilidade</h2></div><input id="traceSearch" class="search" placeholder="Digite OP ou qualquer lote (extrusão, impressão, corte)" oninput="renderTrace()"><div id="traceResult" style="margin-top:12px"></div></section>
</main>

<div id="productModal" class="modal"><div class="sheet"><header><h2 id="productModalTitle">Novo produto</h2><button class="close" onclick="closeM('productModal')">×</button></header><form id="productForm" class="form"><input type="hidden" id="pId"><div class="field"><label>Código do produto</label><input id="pCode" required></div><div class="field"><label>Descrição / produto</label><input id="pName" required></div><div class="field"><label>Cliente</label><input id="pClient"></div><div class="field"><label>Unidade de produção</label><select id="pUnit"><option>UN</option><option>KG</option><option>M</option></select></div><div class="field"><label>Largura (cm)</label><input id="pWidth" type="number" step="0.01"></div><div class="field"><label>Comprimento (cm)</label><input id="pLength" type="number" step="0.01"></div><div class="field"><label>Espessura (mm)</label><input id="pThick" type="number" step="0.001"></div><div class="field"><label>Densidade (g/cm³)</label><input id="pDensity" type="number" step="0.00001" value="0.92"></div><div class="field"><label>Material / resina</label><input id="pMaterial" placeholder="PEBD, PEAD, reciclado..."></div><div class="field"><label>Cor</label><input id="pColor"></div><div class="field"><label>Peso unitário (kg)</label><input id="pUnitWeight" type="number" step="0.000001"><span class="hint">Pode ser calculado automaticamente pelas dimensões.</span></div><div class="field"><label>Preço / kg (R$)</label><input id="pKgPrice" type="number" step="0.00001"></div><div class="field full"><label>Observações técnicas</label><textarea id="pNotes" rows="3"></textarea></div><div class="actions full"><button type="button" class="btn" onclick="closeM('productModal')">Cancelar</button><button class="btn primary">Salvar produto</button></div></form></div></div>

<div id="opModal" class="modal"><div class="sheet"><header><h2>Nova ordem de produção</h2><button class="close" onclick="closeM('opModal')">×</button></header><form id="opForm" class="form"><div class="field full"><label>Produto da lista</label><select id="opProduct" required onchange="showProductSpec()"></select><div id="opSpec" class="hint"></div></div><div class="field"><label>Quantidade planejada</label><input id="opQty" type="number" min="0.001" step="0.001" required></div><div class="field"><label>Unidade</label><select id="opUnit"><option>UN</option><option>KG</option><option>M</option></select></div><div class="field"><label>Data prevista</label><input id="opDate" type="date"></div><div class="field"><label>Prioridade</label><select id="opPriority"><option>Normal</option><option>Alta</option><option>Urgente</option></select></div><div class="field"><label>Responsável</label><input id="opResponsible"></div><div class="field full"><label>Observações</label><textarea id="opNotes" rows="3"></textarea></div><div class="actions full"><button type="button" class="btn" onclick="closeM('opModal')">Cancelar</button><button class="btn primary">Criar OP</button></div></form></div></div>

<div id="stageModal" class="modal"><div class="sheet"><header><h2 id="stageTitle">Registrar etapa</h2><button class="close" onclick="closeM('stageModal')">×</button></header><form id="stageForm" class="form"><input type="hidden" id="sOp"><input type="hidden" id="sStage"><div class="field full"><label>Origem / lote anterior</label><input id="sPrevious" readonly></div><div class="field"><label>Máquina</label><input id="sMachine" required></div><div class="field"><label>Operador</label><input id="sOperator" required></div><div class="field"><label>Quantidade recebida</label><input id="sReceived" type="number" step="0.001"></div><div class="field"><label>Quantidade produzida</label><input id="sQty" type="number" step="0.001" required></div><div class="field"><label>Perda / refugo</label><input id="sLoss" type="number" step="0.001" value="0"></div><div class="field"><label>Lote gerado</label><input id="sLot" required></div><div class="field"><label>Data e hora</label><input id="sDate" type="datetime-local" required></div><div class="field full"><label>Observações</label><textarea id="sNotes" rows="3"></textarea></div><div class="actions full"><button type="button" class="btn" onclick="closeM('stageModal')">Cancelar</button><button class="btn primary">Registrar etapa</button></div></form></div></div>

<div id="detailModal" class="modal"><div class="sheet"><div id="detail"></div><div class="actions"><button class="btn" onclick="closeM('detailModal')">Fechar</button><button class="btn green" onclick="printOP()">🖨 Imprimir ficha rastreável</button></div></div></div>
<script>
const KEY='controle_producao_v2';let db=loadDB(),currentOp=null;
function loadDB(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return x}catch(e){}return{products:[],ops:[]}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function num(x){return Number(x)||0}function fmt(x){return num(x).toLocaleString('pt-BR',{maximumFractionDigits:3})}function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function closeM(id){document.getElementById(id).classList.remove('open')}function openM(id){document.getElementById(id).classList.add('open')}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeM(m.id)}));
document.querySelectorAll('.nav .btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.v).classList.add('active');renderAll()});
function calcWeight(p){if(num(p.width)&&num(p.length)&&num(p.thick)){return num(p.width)*num(p.length)*(num(p.thick)/10)*num(p.density||.92)/1000}return num(p.unitWeight)}
function openProduct(p){document.getElementById('productForm').reset();p=p||{};pId.value=p.id||'';pCode.value=p.code||'';pName.value=p.name||'';pClient.value=p.client||'';pUnit.value=p.unit||'UN';pWidth.value=p.width||'';pLength.value=p.length||'';pThick.value=p.thick||'';pDensity.value=p.density||.92;pMaterial.value=p.material||'';pColor.value=p.color||'';pUnitWeight.value=p.unitWeight||'';pKgPrice.value=p.kgPrice||'';pNotes.value=p.notes||'';productModalTitle.textContent=p.id?'Editar produto':'Novo produto';openM('productModal')}
productForm.onsubmit=e=>{e.preventDefault();const p={id:pId.value||id(),code:pCode.value.trim(),name:pName.value.trim(),client:pClient.value.trim(),unit:pUnit.value,width:num(pWidth.value),length:num(pLength.value),thick:num(pThick.value),density:num(pDensity.value)||.92,material:pMaterial.value.trim(),color:pColor.value.trim(),unitWeight:num(pUnitWeight.value),kgPrice:num(pKgPrice.value),notes:pNotes.value.trim()};if(!p.unitWeight)p.unitWeight=calcWeight(p);const ix=db.products.findIndex(x=>x.id===p.id);if(ix>=0)db.products[ix]=p;else db.products.unshift(p);closeM('productModal');saveDB()}
function delProduct(pid){if(db.ops.some(o=>o.productId===pid)){alert('Produto com OP registrada não pode ser excluído.');return}if(confirm('Excluir produto?')){db.products=db.products.filter(p=>p.id!==pid);saveDB()}}
function openOP(){if(!db.products.length){alert('Cadastre um produto na Lista de produtos antes de criar a OP.');return}opProduct.innerHTML=db.products.map(p=>`<option value="${p.id}">${esc(p.code)} · ${esc(p.name)}</option>`).join('');opDate.value=new Date().toISOString().slice(0,10);opQty.value='';opResponsible.value='';opNotes.value='';showProductSpec();openM('opModal')}
function showProductSpec(){const p=db.products.find(x=>x.id===opProduct.value);if(!p)return;opUnit.value=p.unit||'UN';opSpec.innerHTML=`${esc(p.material||'Material não informado')} · ${esc(p.color||'Cor não informada')} · ${p.width||'—'} × ${p.length||'—'} cm · ${p.thick||'—'} mm · peso unit. ${fmt(p.unitWeight||calcWeight(p))} kg`}
function nextNumber(){let max=0;db.ops.forEach(o=>{const m=String(o.number||'').match(/(\d+)$/);if(m)max=Math.max(max,Number(m[1]))});return`OP-${new Date().getFullYear()}-${String(max+1).padStart(5,'0')}`}
opForm.onsubmit=e=>{e.preventDefault();const p=db.products.find(x=>x.id===opProduct.value);const o={id:id(),number:nextNumber(),productId:p.id,productSnapshot:JSON.parse(JSON.stringify(p)),qty:num(opQty.value),unit:opUnit.value,date:opDate.value,priority:opPriority.value,responsible:opResponsible.value.trim(),notes:opNotes.value.trim(),status:'Aguardando extrusão',createdAt:new Date().toISOString(),stages:{extrusao:null,impressao:null,corte:null}};db.ops.unshift(o);closeM('opModal');saveDB();showOP(o.id)}
const INFO={extrusao:{icon:'🔥',name:'Extrusão',desc:'Filme extrudado'},impressao:{icon:'🖨️',name:'Impressão',desc:'Material impresso'},corte:{icon:'✂️',name:'Corte',desc:'Produto acabado'}};
function prevStage(s){return s==='extrusao'?null:s==='impressao'?'extrusao':'impressao'}
function openStage(oid,s){const o=db.ops.find(x=>x.id===oid);const prev=prevStage(s);if(prev&&!o.stages[prev]){alert(`Registre primeiro a etapa de ${INFO[prev].name}.`);return}const d=o.stages[s];sOp.value=oid;sStage.value=s;sMachine.value=d?.machine||'';sOperator.value=d?.operator||'';sReceived.value=d?.received??(prev?o.stages[prev].qty:o.qty);sQty.value=d?.qty??(prev?o.stages[prev].qty:o.qty);sLoss.value=d?.loss||0;sLot.value=d?.lot||`${s.slice(0,3).toUpperCase()}-${new Date().getFullYear()}-${Math.random().toString(36).slice(2,7).toUpperCase()}`;sDate.value=d?.date||nowLocal();sNotes.value=d?.notes||'';sPrevious.value=prev?(o.stages[prev]?.lot||''):'Matéria-prima / programação da OP';stageTitle.textContent=`${d?'Editar':'Registrar'} ${INFO[s].name} · ${o.number}`;openM('stageModal')}
stageForm.onsubmit=e=>{e.preventDefault();const o=db.ops.find(x=>x.id===sOp.value),s=sStage.value;const prev=prevStage(s);if(prev&&!o.stages[prev])return alert('A etapa anterior precisa estar registrada.');const received=num(sReceived.value),qty=num(sQty.value),loss=num(sLoss.value);if(qty<=0)return alert('Informe a quantidade produzida.');o.stages[s]={lot:sLot.value.trim(),machine:sMachine.value.trim(),operator:sOperator.value.trim(),received,qty,loss,date:sDate.value,notes:sNotes.value.trim(),registeredAt:new Date().toISOString(),sourceLot:prev?o.stages[prev].lot:null};o.status=s==='corte'?'Concluída':s==='extrusao'?'Aguardando impressão':'Aguardando corte';closeM('stageModal');saveDB();showOP(o.id)}
function stageCard(o,s){const d=o.stages[s],i=INFO[s];return`<div class="stage ${d?'done':''}"><div class="ico">${i.icon}</div><h3>${i.name}</h3>${d?`<div class="muted">Lote</div><div class="lot">${esc(d.lot)}</div><div style="margin-top:7px">Produzido: <b>${fmt(d.qty)}</b><br>Perda: ${fmt(d.loss)}<br>Máquina: ${esc(d.machine)}<br>Operador: ${esc(d.operator)}</div><button class="btn" style="margin-top:10px;width:100%" onclick="openStage('${o.id}','${s}')">Editar</button>`:`<div class="muted">${i.desc}<br>Aguardando lançamento</div><button class="btn primary" style="margin-top:10px;width:100%" onclick="openStage('${o.id}','${s}')">Registrar</button>`}</div>`}
function timeline(o){return Object.keys(INFO).map(s=>{const d=o.stages[s],i=INFO[s];return`<div class="event"><div><b>${i.icon} ${i.name}</b><span class="muted">${d?new Date(d.date||d.registeredAt).toLocaleString('pt-BR'):'Pendente'}</span></div><div>${d?`Lote: <b>${esc(d.lot)}</b><br>Origem: ${esc(d.sourceLot||'Programação')}<br>Recebido: ${fmt(d.received)} · Produzido: ${fmt(d.qty)} · Perda: ${fmt(d.loss)}<br>${esc(d.machine)} · ${esc(d.operator)}`:'Etapa ainda não registrada'}</div><div><span class="badge ${d?'green':''}">${d?'Registrado':'Pendente'}</span></div></div>`}).join('')}
function showOP(oid){const o=db.ops.find(x=>x.id===oid);if(!o)return;currentOp=oid;const p=o.productSnapshot||db.products.find(x=>x.id===o.productId)||{};const done=Object.values(o.stages).filter(Boolean).length;detail.innerHTML=`<div class="op-head"><div><div class="muted">ORDEM DE PRODUÇÃO</div><div class="opno">${o.number}</div><b>${esc(p.name)}</b> · ${esc(p.code)}</div><div><span class="badge ${o.status==='Concluída'?'green':'orange'}">${o.status}</span><br><span class="muted">${fmt(o.qty)} ${esc(o.unit)} · ${o.priority}</span></div></div><div class="card" style="margin-top:14px;background:#f8fafc"><b>Ficha técnica:</b> ${esc(p.material||'')} · ${esc(p.color||'')} · ${p.width||'—'} × ${p.length||'—'} cm · ${p.thick||'—'} mm · peso unitário ${fmt(p.unitWeight||calcWeight(p))} kg<br><b>Cliente:</b> ${esc(p.client||'—')} · <b>Responsável:</b> ${esc(o.responsible||'—')} · <b>Previsto:</b> ${esc(o.date||'—')}</div><div class="section"><h2>Fluxo de produção · ${done}/3 etapas</h2><div class="progress" style="width:150px"><i style="width:${done*33.333}%"></i></div></div><div class="flow">${stageCard(o,'extrusao')}${stageCard(o,'impressao')}${stageCard(o,'corte')}</div><div class="section"><h2>Histórico rastreável</h2></div><div class="timeline">${timeline(o)}</div>`;openM('detailModal')}
function renderProducts(){const q=(prodSearch?.value||'').toLowerCase();const a=db.products.filter(p=>(p.code+' '+p.name+' '+p.client).toLowerCase().includes(q));prodTable.innerHTML=a.length?`<table class="table"><thead><tr><th>Código</th><th>Produto</th><th>Cliente</th><th>Ficha técnica</th><th>OPs</th><th></th></tr></thead><tbody>${a.map(p=>`<tr><td><b>${esc(p.code)}</b></td><td>${esc(p.name)}</td><td>${esc(p.client||'—')}</td><td>${esc(p.material||'—')} · ${esc(p.color||'—')}<br>${p.width||'—'}×${p.length||'—'} cm · ${p.thick||'—'} mm</td><td>${db.ops.filter(o=>o.productId===p.id).length}</td><td><button class="btn" onclick='openProduct(${JSON.stringify(p)})'>Editar</button> <button class="btn red" onclick="delProduct('${p.id}')">Excluir</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum produto cadastrado.</div>'}
function renderOps(){const q=(opSearch?.value||'').toLowerCase();const a=db.ops.filter(o=>{const p=o.productSnapshot||{};return(o.number+' '+p.code+' '+p.name+' '+p.client).toLowerCase().includes(q)});opTable.innerHTML=a.length?`<table class="table"><thead><tr><th>OP</th><th>Produto</th><th>Planejado</th><th>Status</th><th>Etapas</th><th></th></tr></thead><tbody>${a.map(o=>{const p=o.productSnapshot||{};const n=Object.values(o.stages).filter(Boolean).length;return`<tr><td><b>${o.number}</b><br><span class="muted">${o.date||''}</span></td><td>${esc(p.name)}<br><span class="muted">${esc(p.code)}</span></td><td>${fmt(o.qty)} ${esc(o.unit)}</td><td><span class="badge ${o.status==='Concluída'?'green':'orange'}">${o.status}</span></td><td>${n}/3<div class="progress"><i style="width:${n*33.333}%"></i></div></td><td><button class="btn primary" onclick="showOP('${o.id}')">Abrir</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Nenhuma OP encontrada.</div>'}
function renderTrace(){const q=(traceSearch?.value||'').trim().toLowerCase();if(!q){traceResult.innerHTML='<div class="card empty">Pesquise uma OP ou lote para visualizar toda a cadeia.</div>';return}const a=db.ops.filter(o=>{const p=o.productSnapshot||{};const lots=Object.values(o.stages).filter(Boolean).flatMap(d=>[d.lot,d.sourceLot,d.machine,d.operator]);return[o.number,p.code,p.name,p.client,...lots].join(' ').toLowerCase().includes(q)});traceResult.innerHTML=a.length?a.map(o=>{const p=o.productSnapshot||{};return`<div class="card" style="margin-bottom:12px"><div class="op-head"><div><div class="muted">ORDEM</div><div class="opno">${o.number}</div><b>${esc(p.name)}</b> · ${esc(p.code)}</div><button class="btn primary" onclick="showOP('${o.id}')">Abrir ficha</button></div><div class="flow" style="margin-top:13px">${Object.keys(INFO).map(s=>{const d=o.stages[s],i=INFO[s];return`<div class="stage ${d?'done':''}"><b>${i.icon} ${i.name}</b><br>${d?`Lote: <span class="lot">${esc(d.lot)}</span><br>Qtd.: ${fmt(d.qty)} ${esc(o.unit)}`:'Pendente'}</div>`}).join('')}</div></div>`}).join(''):'<div class="card empty">Nenhum registro encontrado.</div>'}
function renderHome(){const open=db.ops.filter(o=>o.status!=='Concluída').length,done=db.ops.filter(o=>o.status==='Concluída').length;stats.innerHTML=`<div class="stat"><span>Produtos cadastrados</span><b>${db.products.length}</b></div><div class="stat"><span>OPs em produção</span><b>${open}</b></div><div class="stat"><span>OPs concluídas</span><b>${done}</b></div><div class="stat"><span>Total de OPs</span><b>${db.ops.length}</b></div>`;homeOps.innerHTML=db.ops.length?db.ops.slice(0,8).map(o=>{const p=o.productSnapshot||{};const n=Object.values(o.stages).filter(Boolean).length;return`<div style="display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)"><div><b>${o.number}</b> · ${esc(p.name)}<br><span class="muted">${fmt(o.qty)} ${esc(o.unit)} · ${n}/3 etapas · ${o.status}</span></div><button class="btn" onclick="showOP('${o.id}')">Abrir</button></div>`}).join(''):'<div class="empty">Nenhuma ordem de produção cadastrada.</div>'}
function renderAll(){renderHome();renderProducts();renderOps();renderTrace()}
function printOP(){const o=db.ops.find(x=>x.id===currentOp);if(!o)return;const p=o.productSnapshot||{};const w=window.open('','_blank');if(!w)return;w.document.write(`<html><head><title>${o.number}</title><style>body{font:12px Arial;color:#111;padding:25px}h1{margin:0 0 4px;font-size:22px}.muted{color:#666}.box{border:1px solid #999;padding:12px;margin:12px 0;border-radius:6px}.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stage{border:1px solid #999;padding:10px;min-height:190px}.stage h2{font-size:15px}.line{margin:8px 0;border-bottom:1px solid #bbb;padding-bottom:4px}.sign{height:45px;border-bottom:1px solid #777;margin-top:25px}</style></head><body><h1>ORDEM DE PRODUÇÃO — ${o.number}</h1><div class="muted">Ficha de controle rastreável</div><div class="box"><b>Produto:</b> ${esc(p.name)} (${esc(p.code)})<br><b>Cliente:</b> ${esc(p.client||'—')}<br><b>Quantidade:</b> ${fmt(o.qty)} ${esc(o.unit)}<br><b>Ficha:</b> ${esc(p.material||'')} · ${esc(p.color||'')} · ${p.width||'—'} × ${p.length||'—'} cm · ${p.thick||'—'} mm<br><b>Data prevista:</b> ${esc(o.date||'—')} · <b>Responsável:</b> ${esc(o.responsible||'—')}</div><div class="stages">${Object.keys(INFO).map(s=>{const d=o.stages[s],i=INFO[s];return`<div class="stage"><h2>${i.icon} ${i.name}</h2><div class="line"><b>Lote:</b> ${d?esc(d.lot):'________________________'}</div><div class="line"><b>Lote origem:</b> ${d?esc(d.sourceLot||'Programação'):'________________'}</div><div class="line"><b>Máquina:</b> ${d?esc(d.machine):'________________'}</div><div class="line"><b>Operador:</b> ${d?esc(d.operator):'________________'}</div><div class="line"><b>Recebido:</b> ${d?fmt(d.received):'________'} &nbsp; <b>Produzido:</b> ${d?fmt(d.qty):'________'}</div><div class="line"><b>Perda/refugo:</b> ${d?fmt(d.loss):'________'}</div><div class="line"><b>Data/hora:</b> ${d?esc(d.date):'________________'}</div><div class="sign">Assinatura</div></div>`}).join('')}</div><div class="box"><b>Observações:</b><br>${esc(o.notes||'')||'________________________________________________________________________________'}<br><br><b>Emissão:</b> ${new Date().toLocaleString('pt-BR')}</div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
renderAll();
</script></body></html>
