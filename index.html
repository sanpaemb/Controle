<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle · Produção</title>
<style>
:root{--bg:#0b0e13;--card:#141922;--card2:#1b222d;--line:#283241;--text:#f2f5f8;--muted:#8d99a8;--accent:#c9f23d;--blue:#5aa9ff;--green:#38d996;--orange:#ffb454;--red:#ff6666}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:25px;font-weight:800}.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:10px 14px;border-radius:10px}.btn.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}.btn.danger{color:#fff;background:#5b2020;border-color:#783333}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.nav button{white-space:nowrap}.nav button.active{background:var(--accent);color:#111;border-color:var(--accent)}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:25px;margin-top:7px}.muted{color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.section h2{font-size:16px;margin:0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--card2);font-size:11px}.badge.green{color:var(--green)}.badge.orange{color:var(--orange)}.badge.blue{color:var(--blue)}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.step{flex:1;min-width:150px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px}.step.done{border-color:#267b5b}.step .ico{font-size:22px}.step b{display:block;margin:7px 0}.progress{height:7px;background:var(--card2);border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.search{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px}.sheet h2{margin-top:0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.7px}.field input,.field select,.field textarea{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px;width:100%}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.op-head{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.op-number{font-size:24px;font-weight:800}.timeline{display:grid;gap:10px}.event{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);padding:13px;border-radius:12px}.event h3{margin:0 0 5px;font-size:14px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.event{grid-template-columns:1fr}.table{font-size:12px}.hide-sm{display:none}}@media(max-width:520px){#app{padding:14px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.btn{padding:9px}}
</style></head>
<body><div id="app">
<header class="top"><div class="brand">Controle<small>Produção & rastreabilidade</small></div><button class="btn primary" onclick="openProduct()">+ Produto</button></header>
<nav class="nav"><button class="btn active" data-view="dashboard">Visão geral</button><button class="btn" data-view="products">Produtos</button><button class="btn" data-view="ops">Ordens de produção</button><button class="btn" data-view="trace">Rastreabilidade</button></nav>
<section id="dashboard" class="view active"><div class="grid" id="stats"></div><div class="section"><h2>Produção em andamento</h2><button class="btn primary" onclick="openOP()">+ Nova OP</button></div><div id="dashOps" class="card"></div></section>
<section id="products" class="view"><div class="section"><h2>Lista de produtos</h2><button class="btn primary" onclick="openProduct()">+ Cadastrar produto</button></div><div class="card"><input id="productSearch" class="search" placeholder="Buscar produto, código ou cliente..." oninput="renderProducts()"><div id="productTable"></div></div></section>
<section id="ops" class="view"><div class="section"><h2>Ordens de produção</h2><button class="btn primary" onclick="openOP()">+ Nova OP</button></div><div class="card"><input id="opSearch" class="search" placeholder="Buscar OP ou produto..." oninput="renderOPs()"><div id="opTable"></div></div></section>
<section id="trace" class="view"><div class="section"><h2>Consulta de rastreabilidade</h2></div><input id="traceSearch" class="search" placeholder="Digite OP, lote de extrusão, impressão ou corte" oninput="renderTrace()"><div id="traceResult" style="margin-top:12px"></div></section>
</div>

<div id="productModal" class="modal"><div class="sheet"><h2 id="productTitle">Novo produto</h2><form id="productForm" class="form"><input type="hidden" id="pId"><div class="field"><label>Código</label><input id="pCode" required></div><div class="field"><label>Nome do produto</label><input id="pName" required></div><div class="field"><label>Cliente</label><input id="pClient"></div><div class="field"><label>Unidade</label><select id="pUnit"><option>UN</option><option>KG</option><option>M</option></select></div><div class="field"><label>Largura (mm)</label><input id="pWidth" type="number"></div><div class="field"><label>Espessura (micra)</label><input id="pThick" type="number"></div><div class="field"><label>Material / resina</label><input id="pMaterial" placeholder="PEBD, PEAD..." ></div><div class="field"><label>Cor</label><input id="pColor"></div><div class="field full"><label>Observações técnicas</label><textarea id="pNotes" rows="3"></textarea></div><div class="actions full"><button type="button" class="btn" onclick="closeModal('productModal')">Cancelar</button><button class="btn primary">Salvar produto</button></div></form></div></div>

<div id="opModal" class="modal"><div class="sheet"><h2>Nova ordem de produção</h2><form id="opForm" class="form"><div class="field full"><label>Produto da lista</label><select id="opProduct" required></select></div><div class="field"><label>Quantidade planejada</label><input id="opQty" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Prioridade</label><select id="opPriority"><option>Normal</option><option>Alta</option><option>Urgente</option></select></div><div class="field"><label>Data prevista</label><input id="opDate" type="date"></div><div class="field"><label>Responsável</label><input id="opResponsible"></div><div class="field full"><label>Observação da OP</label><textarea id="opNotes" rows="3"></textarea></div><div class="actions full"><button type="button" class="btn" onclick="closeModal('opModal')">Cancelar</button><button class="btn primary">Criar OP</button></div></form></div></div>

<div id="stageModal" class="modal"><div class="sheet"><h2 id="stageTitle">Registrar etapa</h2><form id="stageForm" class="form"><input type="hidden" id="sOp"><input type="hidden" id="sStage"><div class="field"><label>Máquina</label><input id="sMachine"></div><div class="field"><label>Operador</label><input id="sOperator"></div><div class="field"><label>Quantidade produzida</label><input id="sQty" type="number" step="0.01"></div><div class="field"><label>Perda / refugo</label><input id="sLoss" type="number" step="0.01" value="0"></div><div class="field"><label>Lote gerado</label><input id="sLot" required></div><div class="field"><label>Data/hora</label><input id="sDate" type="datetime-local"></div><div class="field full"><label>Observações</label><textarea id="sNotes" rows="3"></textarea></div><div class="actions full"><button type="button" class="btn" onclick="closeModal('stageModal')">Cancelar</button><button class="btn primary">Registrar etapa</button></div></form></div></div>

<div id="detailModal" class="modal"><div class="sheet"><div id="detail"></div><div class="actions"><button class="btn" onclick="closeModal('detailModal')">Fechar</button><button class="btn" onclick="printOP()">🖨 Imprimir controle</button></div></div></div>

<script>
const KEY='controle_producao_v1';
let db=load();let currentOp=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{products:[],ops:[]}}catch(e){return{products:[],ops:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function opNo(){const y=new Date().getFullYear();const n=(db.ops.length+1).toString().padStart(5,'0');return `OP-${y}-${n}`}
function lot(prefix){return `${prefix}-${new Date().getFullYear()}-${Math.random().toString(36).slice(2,7).toUpperCase()}`}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmt(n){return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2})}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function openModal(id){document.getElementById(id).classList.add('open')}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(b.dataset.view).classList.add('active');renderAll()});
function openProduct(p){document.getElementById('productForm').reset();document.getElementById('pId').value=p?.id||'';document.getElementById('pCode').value=p?.code||'';document.getElementById('pName').value=p?.name||'';document.getElementById('pClient').value=p?.client||'';document.getElementById('pUnit').value=p?.unit||'UN';document.getElementById('pWidth').value=p?.width||'';document.getElementById('pThick').value=p?.thick||'';document.getElementById('pMaterial').value=p?.material||'';document.getElementById('pColor').value=p?.color||'';document.getElementById('pNotes').value=p?.notes||'';document.getElementById('productTitle').textContent=p?'Editar produto':'Novo produto';openModal('productModal')}
document.getElementById('productForm').onsubmit=e=>{e.preventDefault();const id=document.getElementById('pId').value;const p={id:id||uid(),code:pCode.value.trim(),name:pName.value.trim(),client:pClient.value.trim(),unit:pUnit.value,width:pWidth.value,thick:pThick.value,material:pMaterial.value.trim(),color:pColor.value.trim(),notes:pNotes.value.trim()};if(id)db.products=db.products.map(x=>x.id===id?p:x);else db.products.push(p);closeModal('productModal');save()}
function deleteProduct(id){if(db.ops.some(o=>o.productId===id)){alert('Este produto já possui OPs e não pode ser excluído.');return}if(confirm('Excluir produto?')){db.products=db.products.filter(x=>x.id!==id);save()}}
function openOP(){if(!db.products.length){alert('Cadastre primeiro um produto na Lista de Produtos.');return}opProduct.innerHTML=db.products.map(p=>`<option value="${p.id}">${esc(p.code)} · ${esc(p.name)}</option>`).join('');opDate.value=new Date().toISOString().slice(0,10);opQty.value='';opResponsible.value='';opNotes.value='';openModal('opModal')}
document.getElementById('opForm').onsubmit=e=>{e.preventDefault();const o={id:uid(),number:opNo(),productId:opProduct.value,qty:Number(opQty.value),priority:opPriority.value,date:opDate.value,responsible:opResponsible.value.trim(),notes:opNotes.value.trim(),status:'Aguardando extrusão',createdAt:new Date().toISOString(),stages:{extrusao:null,impressao:null,corte:null}};db.ops.unshift(o);closeModal('opModal');save();showOP(o.id)}
function nextStage(o){if(!o.stages.extrusao)return['extrusao','Extrusão'];if(!o.stages.impressao)return['impressao','Impressão'];if(!o.stages.corte)return['corte','Corte'];return null}
const stageInfo={extrusao:['🔥','Extrusão','Filme'],impressao:['🖨️','Impressão','Material impresso'],corte:['✂️','Corte','Produto acabado']};
function openStage(opId,stage){const o=db.ops.find(x=>x.id===opId);const s=stage||nextStage(o)?.[0];if(!s)return;const prev=s==='extrusao'?null:o.stages[s==='impressao'?'extrusao':'impressao'];sOp.value=opId;sStage.value=s;sLot.value=lot(s==='extrusao'?'EXT':s==='impressao'?'IMP':'CRT');sQty.value=prev?.qty||o.qty;sLoss.value=0;sMachine.value='';sOperator.value='';sNotes.value='';sDate.value=new Date().toISOString().slice(0,16);stageTitle.textContent=`Registrar ${stageInfo[s][1]} · ${o.number}`;openModal('stageModal')}
document.getElementById('stageForm').onsubmit=e=>{e.preventDefault();const o=db.ops.find(x=>x.id===sOp.value);const s=sStage.value;o.stages[s]={lot:sLot.value.trim(),machine:sMachine.value.trim(),operator:sOperator.value.trim(),qty:Number(sQty.value||0),loss:Number(sLoss.value||0),date:sDate.value,notes:sNotes.value.trim(),registeredAt:new Date().toISOString()};o.status=s==='corte'?'Concluída':s==='extrusao'?'Aguardando impressão':'Aguardando corte';closeModal('stageModal');save();showOP(o.id)}
function showOP(id){const o=db.ops.find(x=>x.id===id);if(!o)return;currentOp=id;const p=db.products.find(x=>x.id===o.productId)||{};detail.innerHTML=`<div class="op-head"><div><div class="muted">ORDEM DE PRODUÇÃO</div><div class="op-number">${o.number}</div><div>${esc(p.name)} · ${esc(p.code)}</div></div><div><span class="badge ${o.status==='Concluída'?'green':'orange'}">${o.status}</span><br><span class="muted">Planejado: ${fmt(o.qty)} ${p.unit||'UN'}</span></div></div><hr style="border-color:var(--line);margin:18px 0"><div class="flow">${stageCard(o,'extrusao')}${stageCard(o,'impressao')}${stageCard(o,'corte')}</div><div class="section"><h2>Dados da OP</h2></div><div class="card"><b>Cliente:</b> ${esc(p.client||'—')}<br><b>Data:</b> ${esc(o.date||'—')}<br><b>Responsável:</b> ${esc(o.responsible||'—')}<br><b>Prioridade:</b> ${esc(o.priority)}<br><b>Observações:</b> ${esc(o.notes||'—')}</div><div class="section"><h2>Histórico rastreável</h2></div><div class="timeline">${timeline(o)}</div>`;openModal('detailModal')}
function stageCard(o,s){const d=o.stages[s],i=stageInfo[s];return `<div class="step ${d?'done':''}"><div class="ico">${i[0]}</div><b>${i[1]}</b><div class="muted">${d?`Lote: <strong>${esc(d.lot)}</strong><br>Qtd.: ${fmt(d.qty)}<br>Máquina: ${esc(d.machine||'—')}`:'Aguardando lançamento'}</div>${!d?`<button class="btn primary" style="margin-top:10px;width:100%" onclick="openStage('${o.id}','${s}')">Registrar</button>`:`<button class="btn" style="margin-top:10px;width:100%" onclick="openStage('${o.id}','${s}')">Editar</button>`}</div>`}
function timeline(o){return Object.entries(stageInfo).map(([s,i])=>{const d=o.stages[s];return `<div class="event"><div><b>${i[0]} ${i[1]}</b><br><span class="muted">${d?new Date(d.date||d.registeredAt).toLocaleString('pt-BR'):'—'}</span></div><div>${d?`<h3>Lote ${esc(d.lot)}</h3>${esc(d.operator||'Sem operador')} · ${esc(d.machine||'Sem máquina')}<br>Produzido: ${fmt(d.qty)} · Perda: ${fmt(d.loss)}`:'Etapa ainda não registrada'}</div><div>${d?'<span class="badge green">Registrado</span>':'<span class="badge">Pendente</span>'}</div></div>`}).join('')}
function renderProducts(){const q=(productSearch.value||'').toLowerCase();const a=db.products.filter(p=>(p.code+' '+p.name+' '+p.client).toLowerCase().includes(q));productTable.innerHTML=a.length?`<table class="table"><thead><tr><th>Código</th><th>Produto</th><th>Cliente</th><th>Especificação</th><th></th></tr></thead><tbody>${a.map(p=>`<tr><td>${esc(p.code)}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.client||'—')}</td><td>${p.width?esc(p.width)+'mm · ':''}${p.thick?esc(p.thick)+'µ · ':''}${esc(p.material||'')}</td><td><button class="btn" onclick='openProduct(${JSON.stringify(p)})'>Editar</button> <button class="btn danger" onclick="deleteProduct('${p.id}')">Excluir</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum produto cadastrado.</div>'}
function renderOPs(){const q=(opSearch.value||'').toLowerCase();const a=db.ops.filter(o=>{const p=db.products.find(x=>x.id===o.productId)||{};return(o.number+' '+p.name+' '+p.code).toLowerCase().includes(q)});opTable.innerHTML=a.length?`<table class="table"><thead><tr><th>OP</th><th>Produto</th><th>Qtd.</th><th>Status</th><th>Rastreamento</th><th></th></tr></thead><tbody>${a.map(o=>{const p=db.products.find(x=>x.id===o.productId)||{};const done=['extrusao','impressao','corte'].filter(s=>o.stages[s]).length;return `<tr><td><b>${o.number}</b><br><span class="muted">${o.date||''}</span></td><td>${esc(p.name)}</td><td>${fmt(o.qty)} ${p.unit||'UN'}</td><td><span class="badge ${o.status==='Concluída'?'green':'orange'}">${o.status}</span></td><td>${done}/3 etapas<br><div class="progress"><i style="width:${done*33.33}%"></i></div></td><td><button class="btn primary" onclick="showOP('${o.id}')">Abrir</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Nenhuma OP criada.</div>'}
function renderTrace(){const q=(traceSearch.value||'').trim().toLowerCase();if(!q){traceResult.innerHTML='<div class="empty card">Informe uma OP ou lote para consultar a cadeia de produção.</div>';return}const a=db.ops.filter(o=>{const p=db.products.find(x=>x.id===o.productId)||{};const vals=[o.number,p.name,p.code,...Object.values(o.stages).filter(Boolean).flatMap(s=>[s.lot,s.machine,s.operator])];return vals.join(' ').toLowerCase().includes(q)});traceResult.innerHTML=a.length?a.map(o=>{const p=db.products.find(x=>x.id===o.productId)||{};return `<div class="card" style="margin-bottom:12px"><div class="op-head"><div><span class="muted">ORDEM</span><div class="op-number">${o.number}</div><b>${esc(p.name)}</b></div><button class="btn primary" onclick="showOP('${o.id}')">Ver ficha</button></div><div class="flow" style="margin-top:15px">${Object.entries(stageInfo).map(([s,i])=>{const d=o.stages[s];return `<div class="step ${d?'done':''}"><b>${i[0]} ${i[1]}</b><div class="muted">${d?'Lote: '+esc(d.lot)+'<br>'+fmt(d.qty)+' produzidos':'Pendente'}</div></div>`}).join('')}</div></div>`}).join(''):'<div class="empty card">Nenhum registro encontrado.</div>'}
function renderDash(){const total=db.ops.length,done=db.ops.filter(o=>o.status==='Concluída').length,waiting=db.ops.filter(o=>o.status!=='Concluída').length,products=db.products.length;stats.innerHTML=`<div class="stat"><span class="muted">Produtos</span><b>${products}</b></div><div class="stat"><span class="muted">OPs abertas</span><b>${waiting}</b></div><div class="stat"><span class="muted">OPs concluídas</span><b>${done}</b></div><div class="stat"><span class="muted">Total de OPs</span><b>${total}</b></div>`;dashOps.innerHTML=db.ops.length?db.ops.slice(0,8).map(o=>{const p=db.products.find(x=>x.id===o.productId)||{};const n=['extrusao','impressao','corte'].filter(s=>o.stages[s]).length;return `<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${o.number}</b> · ${esc(p.name)}<br><span class="muted">${fmt(o.qty)} ${p.unit||'UN'} · ${n}/3 etapas</span></div><button class="btn" onclick="showOP('${o.id}')">Abrir</button></div>`}).join(''):'<div class="empty">Nenhuma ordem de produção ainda.</div>'}
function renderAll(){renderDash();renderProducts();renderOPs();renderTrace()}
function printOP(){if(!currentOp)return;const o=db.ops.find(x=>x.id===currentOp),p=db.products.find(x=>x.id===o.productId)||{};const w=window.open('','_blank');w.document.write(`<html><head><title>${o.number}</title><style>body{font:14px Arial;padding:30px;color:#111}h1{margin-bottom:4px}.box{border:1px solid #999;padding:15px;margin:12px 0}.row{display:flex;gap:12px}.row>*{flex:1;border:1px solid #bbb;padding:10px}small{color:#666}</style></head><body><h1>ORDEM DE PRODUÇÃO ${o.number}</h1><small>Controle rastreável de produção</small><div class="box"><b>Produto:</b> ${esc(p.name)} (${esc(p.code)})<br><b>Cliente:</b> ${esc(p.client)}<br><b>Quantidade:</b> ${fmt(o.qty)} ${p.unit||'UN'}<br><b>Data:</b> ${esc(o.date)}</div><div class="row">${Object.entries(stageInfo).map(([s,i])=>{const d=o.stages[s];return `<div><b>${i[0]} ${i[1]}</b><br><br><b>Lote:</b> ${d?esc(d.lot):'________________'}<br><b>Máquina:</b> ${d?esc(d.machine):'________________'}<br><b>Operador:</b> ${d?esc(d.operator):'________________'}<br><b>Produzido:</b> ${d?fmt(d.qty):'________'}<br><b>Perda:</b> ${d?fmt(d.loss):'________'}<br><br>Data/hora: ${d?esc(d.date):'________________'}</div>`}).join('')}</div><div class="box"><b>Histórico:</b> ${o.createdAt}<br><br>Assinatura/observação: _________________________________________________</div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
renderAll();
</script></body></html>
